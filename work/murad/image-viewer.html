<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murad Proof Viewer | Murad Case Study</title>
    <meta name="description" content="Embedded image proof viewer for Murad stakeholder kudos referenced in the case study.">
    <link rel="stylesheet" href="/style.css?v=20260225-2">
    <style>
        .viewer-page {
            min-height: 100vh;
            padding: 40px 0 64px;
        }

        .viewer-shell {
            background: rgba(7, 15, 35, 0.82);
            border: 1px solid rgba(68, 122, 203, 0.28);
            border-radius: 18px;
            padding: 20px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        .viewer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .viewer-header h1 {
            font-size: clamp(24px, 3vw, 34px);
            margin: 0;
        }

        .viewer-header p {
            margin: 6px 0 0;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .viewer-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .viewer-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 14px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(10, 18, 40, 0.85);
            border: 1px solid rgba(68, 122, 203, 0.18);
        }

        .viewer-toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .viewer-toolbar button {
            appearance: none;
            border: 1px solid rgba(68, 122, 203, 0.3);
            background: rgba(68, 122, 203, 0.08);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 8px 12px;
            font: inherit;
            cursor: pointer;
        }

        .viewer-toolbar button:hover {
            background: rgba(68, 122, 203, 0.14);
            border-color: rgba(68, 122, 203, 0.45);
        }

        .viewer-status {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .viewer-frame {
            border-radius: 12px;
            border: 1px solid rgba(68, 122, 203, 0.2);
            background: rgba(0, 0, 0, 0.25);
            padding: 14px;
            min-height: 320px;
        }

        .viewer-image-wrap {
            display: flex;
            justify-content: center;
            overflow: auto;
            border-radius: 10px;
            background: rgba(1, 8, 22, 0.75);
            padding: 8px;
        }

        .viewer-image {
            width: 100%;
            max-width: none;
            height: auto;
            display: block;
            border-radius: 8px;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
            transform-origin: top center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
        }

        .viewer-error {
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fecaca;
            background: rgba(127, 29, 29, 0.18);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .viewer-page {
                padding: 24px 0 40px;
            }

            .viewer-shell {
                padding: 16px;
                border-radius: 14px;
            }

            .viewer-toolbar {
                padding: 10px;
            }

            .viewer-frame {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <header>
        <nav class="container">
            <div class="logo">
                <a href="/" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;">
                    <img src="https://raw.githubusercontent.com/jimmarkunas/portfolio/2722bf9b52e9c947fff242eb252bfe38a2b63cc2/images/logo/ujcg-logo-blue.png" alt="UJCG" style="width:32px;height:32px;object-fit:contain;">
                    JIM MARKUNAS
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="/work/murad/#proof" id="viewerBackNavLink">Back to Case Study</a></li>
                <li><a href="/contact/">Contact</a></li>
            </ul>
            <button class="hamburger" id="hamburger" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <div class="mobile-menu" id="mobileMenu">
        <a href="/work/murad/#proof" id="viewerBackMobileLink">Back to Case Study</a>
        <a href="/contact/">Contact</a>
    </div>

    <main class="viewer-page">
        <div class="container">
            <section class="viewer-shell">
                <div class="viewer-header">
                    <div>
                        <h1 id="viewerTitle">Murad Proof Document</h1>
                        <p id="viewerSubtitle">Stakeholder kudos artifact from Murad launch delivery.</p>
                    </div>
                    <div class="viewer-actions">
                        <a class="btn btn-secondary" id="viewerBackPrimaryLink" href="/work/murad/#proof">Back to Case Study</a>
                        <a class="btn btn-primary" id="viewerOpenLink" href="#" target="_blank" rel="noopener">Open Image in New Tab</a>
                    </div>
                </div>

                <div class="viewer-toolbar" aria-label="Image viewer controls">
                    <div class="viewer-toolbar-group">
                        <button type="button" id="viewerZoomOut">Zoom Out</button>
                        <button type="button" id="viewerZoomIn">Zoom In</button>
                        <button type="button" id="viewerFitWidth">Fit Width</button>
                        <button type="button" id="viewerActualSize">Actual Size</button>
                    </div>
                    <div class="viewer-status" id="viewerStatus">Loading image...</div>
                </div>

                <div class="viewer-frame" id="viewerFrame">
                    <div class="viewer-image-wrap" id="viewerImageWrap" hidden>
                        <img id="viewerImage" class="viewer-image" src="" alt="" draggable="false">
                    </div>
                    <div class="viewer-error" id="viewerError" hidden>
                        Could not load this image. Use
                        <a id="viewerErrorLink" href="#" target="_blank" rel="noopener">Open Image in New Tab</a>.
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="/script.js"></script>
    <script>
        (function () {
            var docs = {
                "van-vuong": {
                    title: "CDO Kudos: Smooth Launch",
                    subtitle: "Van Vuong's direct note after Murad go-live.",
                    file: "/work/murad/images/kudos-vanvuong.jpeg"
                },
                "sharon-chan": {
                    title: "Director of Product Kudos: Go-Live Planning Paid Off",
                    subtitle: "Sharon Chan's follow-up note after launch.",
                    file: "/work/murad/images/kudos-sharonchan.jpeg"
                }
            };

            var params = new URLSearchParams(window.location.search);
            var docKey = params.get("doc") || "van-vuong";
            var from = params.get("from") || "case";
            var selected = docs[docKey] || docs["van-vuong"];

            var titleEl = document.getElementById("viewerTitle");
            var subtitleEl = document.getElementById("viewerSubtitle");
            var statusEl = document.getElementById("viewerStatus");
            var imageEl = document.getElementById("viewerImage");
            var imageWrapEl = document.getElementById("viewerImageWrap");
            var errorEl = document.getElementById("viewerError");
            var openLinkEl = document.getElementById("viewerOpenLink");
            var errorLinkEl = document.getElementById("viewerErrorLink");
            var backNavLinkEl = document.getElementById("viewerBackNavLink");
            var backMobileLinkEl = document.getElementById("viewerBackMobileLink");
            var backPrimaryLinkEl = document.getElementById("viewerBackPrimaryLink");
            var zoomInBtn = document.getElementById("viewerZoomIn");
            var zoomOutBtn = document.getElementById("viewerZoomOut");
            var fitWidthBtn = document.getElementById("viewerFitWidth");
            var actualSizeBtn = document.getElementById("viewerActualSize");

            var zoom = 1;
            var minZoom = 0.5;
            var maxZoom = 2.4;

            function applyZoom() {
                imageEl.style.transform = "scale(" + zoom + ")";
                statusEl.textContent = "Zoom " + Math.round(zoom * 100) + "%";
            }

            function setBackLinks() {
                var backHref = from === "home" ? "/#work" : "/work/murad/#proof";
                var backLabel = from === "home" ? "Back to Homepage" : "Back to Case Study";
                [backNavLinkEl, backMobileLinkEl, backPrimaryLinkEl].forEach(function (el) {
                    if (!el) return;
                    el.href = backHref;
                    el.textContent = backLabel;
                });
            }

            function showError() {
                imageWrapEl.hidden = true;
                errorEl.hidden = false;
                statusEl.textContent = "Image unavailable";
            }

            titleEl.textContent = selected.title;
            subtitleEl.textContent = selected.subtitle;
            document.title = selected.title + " | Murad Case Study";
            openLinkEl.href = selected.file;
            errorLinkEl.href = selected.file;
            setBackLinks();

            imageEl.addEventListener("load", function () {
                imageWrapEl.hidden = false;
                errorEl.hidden = true;
                zoom = 1;
                applyZoom();
            });

            imageEl.addEventListener("error", showError);
            imageEl.src = selected.file;
            imageEl.alt = selected.title;

            zoomInBtn.addEventListener("click", function () {
                zoom = Math.min(maxZoom, zoom + 0.15);
                applyZoom();
            });

            zoomOutBtn.addEventListener("click", function () {
                zoom = Math.max(minZoom, zoom - 0.15);
                applyZoom();
            });

            fitWidthBtn.addEventListener("click", function () {
                zoom = 1;
                applyZoom();
            });

            actualSizeBtn.addEventListener("click", function () {
                zoom = 1.6;
                applyZoom();
            });
        })();
    </script>
</body>
</html>
