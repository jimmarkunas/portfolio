name: Build and Deploy Static Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve and validate GA measurement ID
        env:
          REPO_VARS_JSON: ${{ toJson(vars) }}
        run: |
          GA_ID="$(node -e "const vars = JSON.parse(process.env.REPO_VARS_JSON || '{}'); process.stdout.write((vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || '').trim());")"

          if [[ -z "${GA_ID}" ]]; then
            echo "NEXT_PUBLIC_GA_MEASUREMENT_ID is not configured for deploy-static workflow." >&2
            exit 1
          fi

          echo "NEXT_PUBLIC_GA_MEASUREMENT_ID=${GA_ID}" >> "$GITHUB_ENV"

      - name: Build static export
        run: npm run build

      - name: Verify restored July static export
        run: |
          set -euo pipefail
          test -d out
          test -f out/index.html
          test ! -e out/agents/index.html
          test ! -e out/usaii/index.html

      - name: Validate Hostinger deploy secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
        run: |
          set -euo pipefail

          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_TARGET_DIR; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret: ${name}" >&2
              missing=1
            fi
          done

          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - name: Install deploy client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Verify Hostinger FTP connection
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          timeout 25s lftp -e "
            set cmd:fail-exit true;
            set net:timeout 10;
            set net:max-retries 1;
            set ftp:ssl-allow false;
            set ftp:passive-mode true;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER};
            pwd;
            quit
          "

      - name: Mirror static export to Hostinger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
        run: |
          set -euo pipefail

          target="${FTP_TARGET_DIR}"
          case "${target}" in
            */) ;;
            *) target="${target}/" ;;
          esac

          timeout 180s lftp -e "
            set cmd:fail-exit true;
            set net:timeout 20;
            set net:max-retries 1;
            set net:persist-retries 0;
            set ftp:ssl-allow false;
            set ftp:passive-mode true;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER};
            mirror --reverse --delete --continue --no-perms --verbose --parallel=4 ./out/ ${target};
            quit
          "
