name: Build and Deploy Static Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve and validate GA measurement ID
        env:
          REPO_VARS_JSON: ${{ toJson(vars) }}
        run: |
          GA_ID="$(node -e "const vars = JSON.parse(process.env.REPO_VARS_JSON || '{}'); process.stdout.write((vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || '').trim());")"

          if [[ -z "${GA_ID}" ]]; then
            echo "NEXT_PUBLIC_GA_MEASUREMENT_ID is not configured for deploy-static workflow." >&2
            echo "Set GitHub Repository Variable NEXT_PUBLIC_GA_MEASUREMENT_ID to your GA4 ID, for example G-XXXXXXX." >&2
            exit 1
          fi

          echo "NEXT_PUBLIC_GA_MEASUREMENT_ID=${GA_ID}" >> "$GITHUB_ENV"

      - name: Build static export
        run: npm run build

      - name: Verify static export
        run: |
          test -d out
          test -f out/index.html
          test -f out/agents/index.html

      - name: Validate Hostinger deploy secrets
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER != '' && secrets.FTP_SERVER || '82.25.83.251' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
        run: |
          set -euo pipefail

          missing=0
          for name in FTP_USERNAME FTP_PASSWORD FTP_TARGET_DIR; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret: ${name}" >&2
              missing=1
            fi
          done

          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - name: Install deploy client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy out folder to Hostinger
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER != '' && secrets.FTP_SERVER || '82.25.83.251' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 3); do
            echo "FTP deploy attempt ${attempt}/3"
            if timeout 300s lftp -e "
              set cmd:fail-exit true;
              set net:timeout 20;
              set net:max-retries 2;
              set net:reconnect-interval-base 5;
              set net:reconnect-interval-max 15;
              set net:persist-retries 0;
              set ssl:verify-certificate false;
              set ftp:ssl-force true;
              set ftp:passive-mode true;
              open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${FTP_HOST};
              pwd;
              mirror --reverse --delete --continue --verbose --parallel=4 out/ ${{ secrets.FTP_TARGET_DIR }};
              set cmd:fail-exit false;
              quit
            "; then
              echo "FTP deploy succeeded on attempt ${attempt}"
              break
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "FTP deploy failed after 3 attempts"
              exit 1
            fi

            sleep "$((attempt * 15))"
          done
