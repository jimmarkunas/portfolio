name: Build and Deploy Static Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve and validate GA measurement ID
        env:
          REPO_VARS_JSON: ${{ toJson(vars) }}
        run: |
          GA_ID="$(node -e "const vars = JSON.parse(process.env.REPO_VARS_JSON || '{}'); process.stdout.write((vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || '').trim());")"

          if [[ -z "${GA_ID}" ]]; then
            echo "NEXT_PUBLIC_GA_MEASUREMENT_ID is not configured for deploy-static workflow." >&2
            echo "Set GitHub Repository Variable NEXT_PUBLIC_GA_MEASUREMENT_ID to your GA4 ID, for example G-XXXXXXX." >&2
            exit 1
          fi

          echo "NEXT_PUBLIC_GA_MEASUREMENT_ID=${GA_ID}" >> "$GITHUB_ENV"

      - name: Build static export
        run: npm run build

      - name: Verify static export
        run: |
          test -d out
          test -f out/index.html
          test -f out/agents/index.html

      - name: Validate Hostinger deploy secrets
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER != '' && secrets.FTP_SERVER || '82.25.83.251' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
        run: |
          set -euo pipefail

          missing=0
          for name in FTP_USERNAME FTP_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret: ${name}" >&2
              missing=1
            fi
          done

          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - name: Install deploy client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy out folder to Hostinger
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER != '' && secrets.FTP_SERVER || '82.25.83.251' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
          FTP_CONNECT_TIMEOUT_SECONDS: "45"
          FTP_TRANSFER_TIMEOUT_SECONDS: "300"
          FTP_DEPLOY_ATTEMPTS: "3"
        run: |
          set -euo pipefail

          if [ -n "${FTP_TARGET_DIR:-}" ]; then
            target="${FTP_TARGET_DIR}"
          elif [[ "${FTP_HOST}" == *.hostingersite.com ]]; then
            target="./"
            echo "Hostinger subdomain FTP host detected; defaulting deploy target to ${target}."
          else
            target="./public_html/"
            echo "FTP_TARGET_DIR secret not set; defaulting to ${target}."
          fi

          case "${target}" in
            */) ;;
            *) target="${target}/" ;;
          esac

          echo "Using deploy target: ${target}"

          for attempt in $(seq 1 "${FTP_DEPLOY_ATTEMPTS}"); do
            echo "FTP deploy attempt ${attempt}/${FTP_DEPLOY_ATTEMPTS}"
            if timeout "${FTP_TRANSFER_TIMEOUT_SECONDS}s" lftp -e "
              set cmd:fail-exit true;
              set net:timeout 30;
              set net:max-retries 8;
              set net:reconnect-interval-base 3;
              set net:reconnect-interval-max 10;
              set net:persist-retries 0;
              set ssl:verify-certificate false;
              set ftp:ssl-force true;
              set ftp:passive-mode true;
              open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_HOST};
              pwd;
              mirror --reverse --delete --continue --no-perms ./out/ ${target};
              set cmd:fail-exit false;
              cls -la ${target}deploy-marker.txt;
              quit
            "; then
              echo "FTP deploy succeeded on attempt ${attempt}"
              break
            fi

            if [ "${attempt}" -eq "${FTP_DEPLOY_ATTEMPTS}" ]; then
              echo "FTP deploy failed after ${FTP_DEPLOY_ATTEMPTS} attempts"
              exit 1
            fi

            sleep "$((attempt * 15))"
          done
