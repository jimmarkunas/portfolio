name: Build and Deploy Static Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve and validate GA measurement ID
        env:
          REPO_VARS_JSON: ${{ toJson(vars) }}
        run: |
          GA_ID="$(node -e "const vars = JSON.parse(process.env.REPO_VARS_JSON || '{}'); process.stdout.write((vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || '').trim());")"

          if [[ -z "${GA_ID}" ]]; then
            echo "NEXT_PUBLIC_GA_MEASUREMENT_ID is not configured for deploy-static workflow." >&2
            exit 1
          fi

          echo "NEXT_PUBLIC_GA_MEASUREMENT_ID=${GA_ID}" >> "$GITHUB_ENV"

      - name: Build static export
        run: npm run build

      - name: Verify restored July static export
        run: |
          set -euo pipefail
          test -d out
          test -f out/index.html
          test ! -e out/agents/index.html
          test ! -e out/usaii/index.html

      - name: Validate Hostinger deploy secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
        run: |
          set -euo pipefail

          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_TARGET_DIR; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret: ${name}" >&2
              missing=1
            fi
          done

          if [[ -z "${FTP_PORT:-}" ]]; then
            echo "FTP_PORT not set. Defaulting to 65002."
            echo "FTP_PORT=65002" >> "$GITHUB_ENV"
          else
            echo "FTP_PORT=${FTP_PORT}" >> "$GITHUB_ENV"
          fi

          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - name: Install deploy client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Mirror static export to Hostinger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
        run: |
          set -euo pipefail

          lftp -u "${FTP_USERNAME}","${FTP_PASSWORD}" -p "${FTP_PORT}" "sftp://${FTP_SERVER}" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 30
          mirror --reverse --delete --verbose --parallel=4 out/ "${FTP_TARGET_DIR}"
          bye
          EOF
