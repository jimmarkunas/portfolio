name: Build and Publish Static Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve and validate GA measurement ID
        env:
          REPO_VARS_JSON: ${{ toJson(vars) }}
        run: |
          GA_ID="$(node -e "const vars = JSON.parse(process.env.REPO_VARS_JSON || '{}'); process.stdout.write((vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || '').trim());")"

          if [[ -z "${GA_ID}" ]]; then
            echo "NEXT_PUBLIC_GA_MEASUREMENT_ID is not configured for deploy-static workflow." >&2
            echo "Set GitHub Repository Variable NEXT_PUBLIC_GA_MEASUREMENT_ID to your GA4 ID, for example G-XXXXXXX." >&2
            exit 1
          fi

          echo "NEXT_PUBLIC_GA_MEASUREMENT_ID=${GA_ID}" >> "$GITHUB_ENV"

      - name: Build static export
        env:
          NEXT_PUBLIC_DEPLOY_SHA: ${{ github.sha }}
        run: npm run build

      - name: Verify out folder exists
        run: |
          test -d out
          test -f out/index.html
          test -f out/cv/index.html
          test -f out/work/index.html
          test -f out/agents/index.html

      - name: Verify deploy artifacts
        run: npm run check:deploy-artifacts -- --sha "${GITHUB_SHA}"

      - name: Publish out folder to hostinger-static branch
        run: |
          set -euo pipefail

          DEPLOY_BRANCH="hostinger-static"
          SOURCE_SHA="${GITHUB_SHA}"
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          TMP_DIR="$(mktemp -d)"

          git clone --branch "${DEPLOY_BRANCH}" "${REPO_URL}" "${TMP_DIR}"

          find "${TMP_DIR}" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "${GITHUB_WORKSPACE}/out/." "${TMP_DIR}/"

          cd "${TMP_DIR}"
          git add -A
          if git diff --cached --quiet; then
            echo "No deploy changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy static site from ${SOURCE_SHA}"
          git push origin "${DEPLOY_BRANCH}"

      - name: Deploy out folder to Hostinger over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USERNAME: ${{ secrets.FTP_USERNAME }}
          SSH_PORT: "65002"
        run: |
          set -euo pipefail

          if [[ -z "${SSH_PRIVATE_KEY}" || -z "${SSH_HOST}" || -z "${SSH_USERNAME}" ]]; then
            echo "Missing SSH deployment secret configuration." >&2
            exit 1
          fi

          key_file="$(mktemp)"
          trap 'rm -f "${key_file}"' EXIT
          chmod 600 "${key_file}"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${key_file}"

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          ssh-keyscan -p "${SSH_PORT}" -T 15 "${SSH_HOST}" >> "${HOME}/.ssh/known_hosts"

          target="/home/${SSH_USERNAME}/domains/greatestpmever.com/public_html/"
          echo "Deploying static files to ${SSH_USERNAME}@${SSH_HOST}:${target}"

          timeout 300s rsync -az --delete --info=progress2 \
            -e "ssh -p ${SSH_PORT} -i ${key_file} -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15" \
            ./out/ "${SSH_USERNAME}@${SSH_HOST}:${target}"

      - name: Verify live deployment
        run: npm run check:live-deployment -- --base-url https://greatestpmever.com --sha "${GITHUB_SHA}"
