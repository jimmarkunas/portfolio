name: Build and Deploy Static Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve and validate GA measurement ID
        env:
          REPO_VARS_JSON: ${{ toJson(vars) }}
        run: |
          GA_ID="$(node -e "const vars = JSON.parse(process.env.REPO_VARS_JSON || '{}'); process.stdout.write((vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || '').trim());")"

          if [[ -z "${GA_ID}" ]]; then
            echo "NEXT_PUBLIC_GA_MEASUREMENT_ID is not configured for deploy-static workflow." >&2
            echo "Set GitHub Repository Variable NEXT_PUBLIC_GA_MEASUREMENT_ID to your GA4 ID, for example G-XXXXXXX." >&2
            exit 1
          fi

          echo "NEXT_PUBLIC_GA_MEASUREMENT_ID=${GA_ID}" >> "$GITHUB_ENV"

      - name: Build static export
        run: npm run build

      - name: Verify static export
        run: |
          test -d out
          test -f out/index.html
          test -f out/agents/index.html

      - name: Validate Hostinger deploy secrets
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_TARGET_DIR: ${{ secrets.HOSTINGER_TARGET_DIR }}
        run: |
          set -euo pipefail

          missing=0
          for name in HOSTINGER_HOST HOSTINGER_USERNAME HOSTINGER_PASSWORD HOSTINGER_TARGET_DIR; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret: ${name}" >&2
              missing=1
            fi
          done

          if [[ -z "${HOSTINGER_PORT:-}" ]]; then
            echo "HOSTINGER_PORT not set. Defaulting to 65002."
            echo "HOSTINGER_PORT=65002" >> "$GITHUB_ENV"
          else
            echo "HOSTINGER_PORT=${HOSTINGER_PORT}" >> "$GITHUB_ENV"
          fi

          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - name: Install deploy client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy out folder to Hostinger
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_TARGET_DIR: ${{ secrets.HOSTINGER_TARGET_DIR }}
        run: |
          set -euo pipefail

          lftp -u "${HOSTINGER_USERNAME}","${HOSTINGER_PASSWORD}" -p "${HOSTINGER_PORT}" "sftp://${HOSTINGER_HOST}" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 30
          mirror --reverse --delete --verbose --parallel=4 out/ "${HOSTINGER_TARGET_DIR}"
          bye
          EOF
