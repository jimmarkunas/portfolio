name: Validate Case Template Contract

on:
  pull_request:
    paths:
      - "work/**"
      - "styles/**"
      - "scripts/case_template_pipeline.py"
      - "docs/CASE-MIGRATION-PIPELINE.md"
  push:
    branches:
      - main
    paths:
      - "work/**"
      - "styles/**"
      - "scripts/case_template_pipeline.py"
      - "docs/CASE-MIGRATION-PIPELINE.md"

jobs:
  validate-case-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate migrated case-study pages
        run: |
          python3 scripts/case_template_pipeline.py validate \
            --include-template-test \
            --strict \
            --skip-baseline

