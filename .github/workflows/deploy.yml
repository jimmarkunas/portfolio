name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify pre-deploy build
        run: npm run verify:predeploy

      - name: Add deploy marker
        run: |
          printf "sha=%s\nutc=%s\nrun=%s\n" \
            "${GITHUB_SHA}" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "${GITHUB_RUN_NUMBER}" > ./out/deploy-marker.txt

      - name: Check build output
        run: |
          ls -la ./out/
          ls -la ./out/_next/static/css/

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: out
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: 82.25.83.251
    steps:
      - name: Download static artifact
        uses: actions/download-artifact@v4
        with:
          name: site-out
          path: .

      - name: Check downloaded artifact
        run: |
          ls -la ./out/
          ls -la ./out/_next/static/css/

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Resolve remote deploy directory
        id: deploy_target
        env:
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
        run: |
          set -euo pipefail

          if [ -n "${FTP_TARGET_DIR:-}" ]; then
            target="${FTP_TARGET_DIR}"
          else
            target="./public_html/"
            if root_listing="$(
              lftp -e "
                set cmd:fail-exit true;
                set net:timeout 20;
                set net:max-retries 3;
                set net:reconnect-interval-base 5;
                set ssl:verify-certificate false;
                set ftp:ssl-force true;
                set ftp:passive-mode true;
                open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${FTP_HOST};
                cls -1;
                quit
              " 2>/dev/null
            )"; then
              if ! printf '%s\n' "${root_listing}" | grep -qx "public_html"; then
                target="./"
              fi
            else
              echo "Warning: Could not inspect FTP root; defaulting to ${target}."
            fi
          fi

          case "${target}" in
            */) ;;
            *) target="${target}/" ;;
          esac

          echo "Using deploy target: ${target}"
          echo "target=${target}" >> "${GITHUB_OUTPUT}"

      - name: Inspect remote FTP root
        continue-on-error: true
        run: |
          lftp -e "
            set cmd:fail-exit true;
            set net:timeout 20;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set ssl:verify-certificate false;
            set ftp:ssl-force true;
            set ftp:passive-mode true;
            open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${FTP_HOST};
            pwd;
            cls -la;
            quit
          "

      - name: Deploy via FTP
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "FTP deploy attempt ${attempt}/3"
            if lftp -e "
              set cmd:fail-exit true;
              set net:timeout 20;
              set net:max-retries 5;
              set net:reconnect-interval-base 5;
              set ssl:verify-certificate false;
              set ftp:ssl-force true;
              set ftp:passive-mode true;
              open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${FTP_HOST};
              pwd;
              mirror --reverse --delete --verbose ./out/ ${{ steps.deploy_target.outputs.target }};
              cls -la;
              cls -la ${{ steps.deploy_target.outputs.target }};
              cls -la ${{ steps.deploy_target.outputs.target }}_next;
              cls -la ${{ steps.deploy_target.outputs.target }}_next/static;
              cls -la ${{ steps.deploy_target.outputs.target }}_next/static/css;
              cls -la ${{ steps.deploy_target.outputs.target }}deploy-marker.txt;
              quit
            "; then
              echo "FTP deploy succeeded on attempt ${attempt}"
              break
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "FTP deploy failed after 3 attempts"
              exit 1
            fi

            sleep "$((attempt * 15))"
          done

      - name: Post-deploy smoke check
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          set -euo pipefail

          if [ -z "${PRODUCTION_URL:-}" ]; then
            echo "Skipping smoke check: set PRODUCTION_URL secret to enable checks."
            exit 0
          fi

          base_url="${PRODUCTION_URL%/}"
          for path in "/" "/work/modere" "/deploy-marker.txt"; do
            url="${base_url}${path}"
            status="$(curl -L --max-time 20 --silent --show-error --output /tmp/smoke.txt --write-out "%{http_code}" "${url}" || true)"
            if ! [[ "${status}" =~ ^[0-9]{3}$ ]]; then
              echo "Smoke check failed: no HTTP status for ${url}"
              exit 1
            fi
            if [ "${status}" -lt 200 ] || [ "${status}" -ge 400 ]; then
              echo "Smoke check failed: ${url} returned ${status}"
              head -n 20 /tmp/smoke.txt || true
              exit 1
            fi
            echo "Smoke check passed: ${url} (${status})"
          done
