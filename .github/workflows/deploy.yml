name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check build output
        run: ls -la ./out/

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Inspect remote FTP root
        run: |
          lftp -e "
            set cmd:fail-exit true;
            set net:timeout 20;
            set net:max-retries 1;
            set net:reconnect-interval-base 5;
            set ssl:verify-certificate false;
            set ftp:ssl-force true;
            set ftp:passive-mode true;
            open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} 82.25.83.251;
            pwd;
            cls -la;
            cls -la public_html/;
            quit
          "

      - name: Deploy via FTP
        run: |
          lftp -e "
            set cmd:fail-exit true;
            set net:timeout 20;
            set net:max-retries 1;
            set net:reconnect-interval-base 5;
            set ssl:verify-certificate false;
            set ftp:ssl-force true;
            set ftp:passive-mode true;
            open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} 82.25.83.251;
            cd public_html;
            pwd;
            mirror --reverse --delete --verbose ./out/ .;
            cls -la;
            quit
          "
