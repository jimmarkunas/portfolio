name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_HOST: ftp.peachpuff-monkey-623316.hostingersite.com
      FTP_TARGET_DIR: public_html/
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add deploy marker
        run: |
          printf "sha=%s\\nutc=%s\\nrun=%s\\n" \
            "${GITHUB_SHA}" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "${GITHUB_RUN_NUMBER}" > ./out/deploy-marker.txt

      - name: Check build output
        run: |
          ls -la ./out/
          ls -la ./out/_next/static/css/

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTP
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "FTP deploy attempt ${attempt}/3"
            if lftp -e "
              set cmd:fail-exit true;
              set net:timeout 20;
              set net:max-retries 5;
              set net:reconnect-interval-base 5;
              set ssl:verify-certificate false;
              set ftp:ssl-force true;
              set ftp:passive-mode true;
              open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${FTP_HOST};
              mirror --reverse --delete --verbose ./out/ ${FTP_TARGET_DIR};
              quit
            "; then
              echo "FTP deploy succeeded on attempt ${attempt}"
              break
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "FTP deploy failed after 3 attempts"
              exit 1
            fi

            sleep "$((attempt * 15))"
          done
