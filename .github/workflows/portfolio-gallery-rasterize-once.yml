name: Portfolio gallery rasterize once

on:
  push:
    branches:
      - chore/portfolio-gallery-rasterize-once

permissions:
  contents: write

jobs:
  rasterize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rasterize five oversized gallery SVGs losslessly
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const names = ['aa', 'cbdistillery', 'cps', 'directv01', 'method'];
          const contentPath = 'src/content/site/portfolio.ts';
          const tempRoot = '.tmp-portfolio-raster';
          fs.rmSync(tempRoot, { recursive: true, force: true });
          fs.mkdirSync(tempRoot, { recursive: true });

          function extForMime(mime) {
            const normalized = mime.toLowerCase();
            if (normalized === 'png') return 'png';
            if (normalized === 'jpeg' || normalized === 'jpg') return 'jpg';
            if (normalized === 'webp') return 'webp';
            if (normalized === 'gif') return 'gif';
            throw new Error(`Unsupported embedded raster MIME: image/${mime}`);
          }

          function externalizeEmbeddedRasters(name, svgText) {
            let count = 0;
            const sanitized = svgText.replace(/data:image\/([a-zA-Z0-9.+-]+);base64,([A-Za-z0-9+/=\r\n]+)/g, (whole, mime, payload) => {
              const normalizedPayload = payload.replace(/\s+/g, '');
              const bytes = Buffer.from(normalizedPayload, 'base64');
              const roundTrip = bytes.toString('base64');
              if (roundTrip.replace(/=+$/, '') !== normalizedPayload.replace(/=+$/, '')) {
                throw new Error(`${name}: embedded raster ${count} failed base64 round-trip validation`);
              }
              const ext = extForMime(mime);
              const filename = `${name}-embedded-${String(count).padStart(2, '0')}.${ext}`;
              fs.writeFileSync(path.join(tempRoot, filename), bytes);
              count += 1;
              return filename;
            });
            if (count === 0) throw new Error(`${name}: no embedded base64 raster found`);
            return { sanitized, count };
          }

          function assertSamePixels(name, before, after, label) {
            if (before.info.width !== after.info.width || before.info.height !== after.info.height || before.info.channels !== after.info.channels) {
              throw new Error(`${name}: ${label} geometry changed (${JSON.stringify(before.info)} -> ${JSON.stringify(after.info)})`);
            }
            if (!before.data.equals(after.data)) {
              let changed = 0;
              for (let i = 0; i < before.data.length; i++) {
                if (before.data[i] !== after.data[i]) changed += 1;
              }
              throw new Error(`${name}: ${label} pixel comparison failed (${changed} channel bytes changed)`);
            }
          }

          (async () => {
            const results = [];
            for (const name of names) {
              const svgPath = `public/portfolio-gallery/${name}.svg`;
              const webpPath = `public/portfolio-gallery/${name}.webp`;
              const svgText = fs.readFileSync(svgPath, 'utf8');
              const svgBytes = Buffer.byteLength(svgText);
              const { sanitized, count } = externalizeEmbeddedRasters(name, svgText);
              const tempSvgPath = path.join(tempRoot, `${name}.svg`);
              fs.writeFileSync(tempSvgPath, sanitized);

              // The sanitized SVG retains every original SVG element/transform and replaces
              // only each data: URI with the exact decoded bytes in a local file.
              const sanitizedRender = await sharp(tempSvgPath)
                .ensureAlpha()
                .raw()
                .toBuffer({ resolveWithObject: true });

              // AA is small enough for librsvg to parse directly; use it as a control proving
              // that externalizing the data URI does not alter the rendered result.
              if (name === 'aa') {
                const originalRender = await sharp(svgPath)
                  .ensureAlpha()
                  .raw()
                  .toBuffer({ resolveWithObject: true });
                assertSamePixels(name, originalRender, sanitizedRender, 'externalized-wrapper control');
              }

              const webp = await sharp(tempSvgPath)
                .webp({ lossless: true, effort: 6 })
                .toBuffer();
              fs.writeFileSync(webpPath, webp);

              const webpRender = await sharp(webp)
                .ensureAlpha()
                .raw()
                .toBuffer({ resolveWithObject: true });
              assertSamePixels(name, sanitizedRender, webpRender, 'lossless WebP');

              results.push({
                name,
                width: sanitizedRender.info.width,
                height: sanitizedRender.info.height,
                embeddedRasters: count,
                svgBytes,
                sanitizedSvgBytes: Buffer.byteLength(sanitized),
                webpBytes: webp.length,
                savedBytes: svgBytes - webp.length,
              });
            }

            let content = fs.readFileSync(contentPath, 'utf8');
            for (const name of names) {
              const from = `/portfolio-gallery/${name}.svg`;
              const to = `/portfolio-gallery/${name}.webp`;
              const occurrences = content.split(from).length - 1;
              if (occurrences !== 1) throw new Error(`Expected exactly one live reference for ${from}; found ${occurrences}`);
              content = content.replace(from, to);
              if (content.includes(from)) throw new Error(`Old reference remains after replacement: ${from}`);
            }
            fs.writeFileSync(contentPath, content);

            for (const name of names) {
              fs.unlinkSync(`public/portfolio-gallery/${name}.svg`);
            }
            fs.rmSync(tempRoot, { recursive: true, force: true });

            console.table(results.map(r => ({
              asset: r.name,
              dimensions: `${r.width}x${r.height}`,
              embeds: r.embeddedRasters,
              svgMiB: (r.svgBytes / 1048576).toFixed(2),
              sanitizedKiB: (r.sanitizedSvgBytes / 1024).toFixed(1),
              webpMiB: (r.webpBytes / 1048576).toFixed(2),
              savedMiB: (r.savedBytes / 1048576).toFixed(2),
              pixelMatch: 'EXACT',
            })));
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Confirm bounded source diff
        run: |
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^$|^public/portfolio-gallery/(aa|cbdistillery|cps|directv01|method)\.(svg|webp)$|^src/content/site/portfolio\.ts$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected file in bounded conversion diff:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          npm run dev > /tmp/portfolio-dev.log 2>&1 &
          echo $! > /tmp/portfolio-dev.pid
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/work/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-dev.log
          exit 1

      - name: Fast route check
        run: BASE_URL=http://127.0.0.1:3000 npm run verify:route -- /work/

      - name: Browser-render the five replacement assets
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const targets = ['aa', 'cbdistillery', 'cps', 'directv01', 'method']
            .map(name => `/portfolio-gallery/${name}.webp`);

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
            const failed = [];
            page.on('requestfailed', req => {
              if (targets.some(t => req.url().endsWith(t))) failed.push(`${req.url()} :: ${req.failure()?.errorText || 'request failed'}`);
            });
            page.on('response', res => {
              if (targets.some(t => res.url().endsWith(t)) && !res.ok()) failed.push(`${res.status()} ${res.url()}`);
            });

            const response = await page.goto('http://127.0.0.1:3000/work/', { waitUntil: 'domcontentloaded' });
            if (!response || !response.ok()) throw new Error(`Portfolio route failed: ${response?.status()}`);

            for (const target of targets) {
              const img = page.locator(`img[src="${target}"]`).first();
              if (await img.count() !== 1) throw new Error(`Expected one live <img> reference for ${target}`);
              await img.scrollIntoViewIfNeeded();
              await img.evaluate(async el => {
                if (el.complete && el.naturalWidth > 0) return;
                await new Promise((resolve, reject) => {
                  const timer = setTimeout(() => reject(new Error(`Image load timeout: ${el.src}`)), 10000);
                  el.addEventListener('load', () => { clearTimeout(timer); resolve(); }, { once: true });
                  el.addEventListener('error', () => { clearTimeout(timer); reject(new Error(`Image load failed: ${el.src}`)); }, { once: true });
                });
              });
              const state = await img.evaluate(el => ({ src: el.getAttribute('src'), naturalWidth: el.naturalWidth, naturalHeight: el.naturalHeight }));
              if (!state.naturalWidth || !state.naturalHeight) throw new Error(`Zero-sized browser render: ${target}`);
              console.log(`BROWSER PASS ${state.src} ${state.naturalWidth}x${state.naturalHeight}`);
            }

            if (failed.length) throw new Error(`Replacement asset request failures:\n${failed.join('\n')}`);
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Remove one-off workflow from final diff
        run: git rm .github/workflows/portfolio-gallery-rasterize-once.yml

      - name: Commit converted assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/site/portfolio.ts public/portfolio-gallery
          git commit -m "fix: replace oversized portfolio gallery SVGs"
          git push origin HEAD:chore/portfolio-gallery-rasterize-once
